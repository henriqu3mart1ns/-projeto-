<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <form id="formAluno">

            <input
                type="text"
                id="nome"
                placeholder="Nome do aluno"
                required
            >

            <input
                type="number"
                id="nota1"
                placeholder="Nota 1º bimestre"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <input
                type="number"
                id="nota2"
                placeholder="Nota 2º bimestre"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <button type="submit">
                Calcular Média
            </button>

        </form>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                    <th>Média</th>
                    <th>Situação</th>
                </tr>
            </thead>

            <tbody id="tabelaAlunos">

            </tbody>
        </table>
    </div>

    <script src="script.js"></script>

</body>
</html>
